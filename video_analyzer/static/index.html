<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Analyzer</title>
<style>
  :root { --bg:#0e1013; --card:#171a20; --line:#2a2f39; --text:#e8eaee; --mute:#9aa3b2; --accent:#6ea8ff; --bad:#ff7a7a; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --card:#fff; --line:#dde1e8; --text:#14171c; --mute:#5b6472; --accent:#2f6fe0; --bad:#c93a3a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:820px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:26px; margin:0 0 4px; }
  p.sub { color:var(--mute); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:36px 16px; text-align:center; color:var(--mute); cursor:pointer; }
  #drop.over { border-color:var(--accent); color:var(--text); }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; }
  label { display:block; font-size:13px; color:var(--mute); margin-bottom:4px; }
  select, input[type=text], input[type=password] { width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; }
  .col { flex:1 1 220px; }
  button { margin-top:16px; padding:11px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); margin-top:0; }
  #status { margin-top:16px; color:var(--mute); }
  #status.err { color:var(--bad); }
  #result { margin-top:24px; display:none; }
  #out { white-space:pre-wrap; word-wrap:break-word; font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .bar { display:flex; gap:8px; margin-bottom:12px; }
  small { color:var(--mute); }
</style>
</head>
<body>
<main>
  <h1>Video Analyzer</h1>
  <p class="sub">Drop in a video ad. Gemini watches it and returns a scene-by-scene teardown, transcript, and iteration brief.</p>

  <div class="card">
    <div id="drop" tabindex="0">Drop a video here, or click to choose<br><small id="limits"></small></div>
    <input id="file" type="file" accept="video/*" hidden>

    <div class="row">
      <div class="col">
        <label for="model">Model</label>
        <select id="model"></select>
      </div>
      <div class="col">
        <label for="key">Your Gemini API key <small>(optional if the site provides one)</small></label>
        <input id="key" type="password" placeholder="AIza…" autocomplete="off">
      </div>
      <div class="col" id="codeCol" hidden>
        <label for="code">Access code</label>
        <input id="code" type="password" autocomplete="off">
      </div>
    </div>
    <small>Your key is sent only with your upload request and is never stored. Get one free at <a href="https://aistudio.google.com/apikey" style="color:var(--accent)">Google AI Studio</a>.</small>

    <div><button id="go" disabled>Analyze</button></div>
    <div id="status" role="status"></div>
  </div>

  <div id="result" class="card">
    <div class="bar">
      <button class="ghost" id="copy">Copy</button>
      <button class="ghost" id="dl">Download .md</button>
    </div>
    <div id="out"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let file = null, analysis = '', name = 'analysis';

fetch('api/config').then(r => r.json()).then(c => {
  $('limits').textContent = `Max ${c.max_upload_mb} MB`;
  $('model').innerHTML = c.models.map(m => `<option value="${m}">${m === 'flash' ? 'Flash (fast, default)' : m === 'pro' ? 'Pro (deeper)' : m}</option>`).join('');
  if (c.access_code_required) $('codeCol').hidden = false;
  if (!c.server_key) $('key').placeholder = 'Required: paste your Gemini API key';
}).catch(() => {});

function setFile(f) {
  if (!f) return;
  file = f; name = f.name.replace(/\.[^.]+$/, '');
  $('drop').firstChild.textContent = `${f.name} (${(f.size/1048576).toFixed(1)} MB)`;
  $('go').disabled = false;
}
$('drop').onclick = () => $('file').click();
$('file').onchange = e => setFile(e.target.files[0]);
['dragover','dragenter'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

function status(msg, err) { $('status').textContent = msg; $('status').className = err ? 'err' : ''; }

$('go').onclick = async () => {
  if (!file) return;
  $('go').disabled = true; $('result').style.display = 'none';
  status('Uploading…');
  const fd = new FormData();
  fd.append('video', file); fd.append('model', $('model').value);
  fd.append('api_key', $('key').value); fd.append('access_code', $('code').value);
  try {
    const r = await fetch('api/jobs', { method: 'POST', body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Upload failed');
    const labels = { queued:'Queued…', uploading:'Sending video to Gemini…', analyzing:'Gemini is watching your video (can take a few minutes)…' };
    for (;;) {
      await new Promise(res => setTimeout(res, 3000));
      const s = await (await fetch('api/jobs/' + j.id)).json();
      if (s.error && !s.status) throw new Error(s.error);
      if (s.status === 'error') throw new Error(s.error);
      if (s.status === 'done') { analysis = s.analysis; break; }
      status(labels[s.status] || 'Working…');
    }
    $('out').textContent = analysis; $('result').style.display = 'block'; status('Done.');
  } catch (e) { status(e.message, true); }
  $('go').disabled = false;
};
$('copy').onclick = () => navigator.clipboard.writeText(analysis).then(() => status('Copied.'));
$('dl').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([analysis], { type: 'text/markdown' }));
  a.download = name + '_analysis.md'; a.click();
};
</script>
</body>
</html>
